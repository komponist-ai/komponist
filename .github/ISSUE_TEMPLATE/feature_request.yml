name: Feature request
description: Propose a product or developer-experience improvement.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues for a similar request.
          required: true
        - label: I am describing a user problem, not only a preferred implementation.
          required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Who has this problem and what are they trying to accomplish?
    validations:
      required: true

  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: Describe the behavior or result you would find useful.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: How do you handle this today?

  - type: dropdown
    id: surface
    attributes:
      label: Product surface
      options:
        - Sources and ingestion
        - Review and governance
        - Graph and entities
        - Chat and retrieval
        - Compose
        - Versions
        - API or SDK
        - MCP and agent tools
        - Authentication and organizations
        - Deployment and operations
        - Documentation or developer experience
        - Other
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add sanitized examples, sketches, or references if useful.
