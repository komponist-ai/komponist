# Development override for the full Komponist stack.
#
# Run from the repository root:
# docker compose --env-file .env \
#   -f docker/docker-compose.yml \
#   -f docker/docker-compose.web-dev.yml up -d --build

services:
  web:
    build:
      target: development
    environment:
      - NODE_ENV=development
      - NEXT_TELEMETRY_DISABLED=1
      # Docker Desktop on macOS can miss filesystem events from bind mounts.
      - WATCHPACK_POLLING=true
    volumes:
      - ../apps/web:/app
      # Keep Linux dependencies and build output out of the host checkout.
      - web_node_modules:/app/node_modules
      - web_next:/app/.next

volumes:
  web_node_modules:
  web_next:
