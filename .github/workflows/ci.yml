name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - dev
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  KOMPONIST_AI_MODE: mock
  NEXT_TELEMETRY_DISABLED: "1"
  NODE_VERSION: "20"
  PYTHON_VERSION: "3.12"

jobs:
  python:
    name: Python contracts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: ${{ github.workspace }}/packages
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            apps/api/requirements.txt
            apps/mcp/requirements.txt
            packages/core/pyproject.toml
            packages/core/test-requirements.txt
            packages/pipelines/pyproject.toml

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e packages/core -e packages/pipelines
          python -m pip install \
            -r apps/api/requirements.txt \
            -r apps/mcp/requirements.txt \
            -r packages/core/test-requirements.txt
          python -m pip check

      - name: Compile Python modules
        run: python -m compileall -q apps/api apps/mcp packages/core packages/pipelines

      - name: Run provider-free unit tests
        run: |
          python -m pytest -q \
            packages/core/tests/test_ai_clients.py \
            packages/pipelines/tests/test_contracts.py \
            packages/pipelines/tests/test_document_relationships.py \
            packages/pipelines/tests/test_identical_document_reuse.py

  web:
    name: Web lint and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/web
    env:
      API_URL: http://localhost:8000
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NEXT_PUBLIC_MCP_URL: http://localhost:8080/mcp
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install web dependencies
        run: npm ci --no-audit --no-fund

      - name: Lint web application
        run: npm run lint

      - name: Build web application
        run: npm run build

  sdk:
    name: JavaScript SDK
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: packages/sdk-js
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: packages/sdk-js/package-lock.json

      - name: Install SDK dependencies
        run: npm ci --no-audit --no-fund

      - name: Build SDK
        run: npm run build

      - name: Run SDK tests
        run: npm test

      - name: Verify generated SDK is committed
        working-directory: .
        run: git diff --exit-code -- packages/sdk-js/dist

  integration:
    name: Docker end-to-end
    needs:
      - python
      - web
      - sdk
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      COMPOSE_PROJECT_NAME: komponist-ci
      KOMPONIST_SECRET_KEY: ci-only-secret-key-not-for-production
      NEO4J_PASSWORD: ci-neo4j-password
      NOTION_CLIENT_ID: ""
      NOTION_CLIENT_SECRET: ""
      GOOGLE_AUTH_CLIENT_ID: ""
      GOOGLE_AUTH_CLIENT_SECRET: ""
      GOOGLE_CLIENT_ID: ""
      GOOGLE_CLIENT_SECRET: ""
      POSTGRES_PASSWORD: ci-postgres-password
      SLACK_APPROVALS_CHANNEL: ""
      SLACK_BOT_TOKEN: ""
      SLACK_SIGNING_SECRET: ""
      SLACK_WATCHED_CHANNELS: ""
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Validate Compose configuration
        run: |
          touch .env
          docker compose \
            -f docker/docker-compose.yml \
            -f docker/docker-compose.ci.yml \
            config --quiet

      - name: Validate production Compose configuration
        run: bash scripts/deploy/check-production-compose.sh

      - name: Build and start the stack
        run: |
          docker compose \
            -f docker/docker-compose.yml \
            -f docker/docker-compose.ci.yml \
            up -d --build --wait --wait-timeout 240

      - name: Run end-to-end suite
        run: bash scripts/ci/run-e2e.sh

      - name: Show service diagnostics
        if: always()
        run: |
          docker compose \
            -f docker/docker-compose.yml \
            -f docker/docker-compose.ci.yml \
            ps
          docker compose \
            -f docker/docker-compose.yml \
            -f docker/docker-compose.ci.yml \
            logs --no-color --tail=200 api mcp web postgres neo4j

      - name: Stop the stack
        if: always()
        run: |
          docker compose \
            -f docker/docker-compose.yml \
            -f docker/docker-compose.ci.yml \
            down --volumes --remove-orphans
