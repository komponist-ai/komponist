[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "komponist-core"
version = "0.1.0"
description = "Core package for Komponist: graph client, models, LLM wrapper, embeddings"
requires-python = ">=3.11"
dependencies = [
    "neo4j>=5.14.0",
    "anthropic>=0.7.0",
    "openai>=1.3.0",
    "httpx>=0.25.0",
    "pydantic>=2.5.0",
]

[tool.setuptools.packages.find]
where = ["."]
